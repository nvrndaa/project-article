<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: column; 
            /* main axis adalah nilain default dari flex-direction, settingannya adalah justify-content */
            justify-content: center;
            /* cross axis nilai kebalikan dari sumbu utama, settingannya adalah alight-items */
            align-items: center; 
            width: 600px;
            height: 300px;
            border: 3px solid black;
        }

        .box{
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            width: 100px;
            height: 100px;
            background-color: blueviolet;

            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Belajar flex decoration</h1>

    <div class="container">
        <div class="box"> Box 1</div>
        <div class="box"> Box 2</div>
        <div class="box"> Box 3</div>
    </div>
</body>
</html>
